[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roosttracker"
version = "0.1.0"
description = "Replay timestamped radar frames of roost events (starter MVP)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
roosttracker-api = "roosttracker.server:main"
roosttracker-demo = "roosttracker.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
